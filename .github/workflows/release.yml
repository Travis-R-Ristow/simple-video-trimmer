name: Release

# Build the Windows installer and publish it to a GitHub Release whenever a
# version tag (e.g. v1.0.1) is pushed. The uploaded installer, latest.yml and
# blockmap are what the in-app updater uses to detect and apply updates.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish

      # electron-builder uploads assets to a draft release; promote it to a
      # published release so it's downloadable and the updater can detect it.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
